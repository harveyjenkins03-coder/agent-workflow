<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The modules in agent-workflow</title><desc id="d">Plans are replayed in a fresh worktree; memory writes pass an injection screen before they are stored; agent profiles are checked and held, and only a person writes the agent file.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#262c34"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f3e"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="12" fill="#181b20" stroke="#323a44" stroke-width="1.5"/><rect x="1" y="1" width="958" height="558" rx="12" fill="url(#dots)"/><text x="32" y="44" font-size="20" font-weight="600" fill="#ece4d6" text-anchor="start">Three flows, one rule: a person makes the last move</text><text x="32" y="68" font-size="14" font-weight="400" fill="#a7afb8" text-anchor="start">Four modules: the injection screen is shared by memory and profile_gate. Arrows show the order.</text><text x="176" y="104" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">plankit</text><rect x="32" y="120" width="288" height="70" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="144" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">A written plan</text><text x="46" y="165" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Markdown tasks with diffs</text><path d="M176,190 L176,226" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="226" width="288" height="70" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="250" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">apply</text><text x="46" y="271" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">git apply, task by task</text><path d="M176,296 L176,332" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="332" width="288" height="90" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="356" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">replay</text><text x="46" y="377" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">the whole plan in a fresh</text><text x="46" y="396" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">worktree, against an expected diff</text><text x="480" y="104" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">memory</text><rect x="336" y="120" width="288" height="70" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="350" y="144" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">A note to remember</text><text x="350" y="165" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">from an agent or a person</text><path d="M480,190 L480,226" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="336" y="226" width="288" height="90" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="350" y="250" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="start">injection screen</text><text x="350" y="271" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">secret-shaped and</text><text x="350" y="290" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">instruction-shaped text</text><path d="M480,316 L480,352" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="336" y="352" width="288" height="90" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="350" y="376" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">SQLite FTS5 store</text><text x="350" y="397" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">trust levels, decay, quarantine,</text><text x="350" y="416" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">a capped recall window</text><text x="784" y="104" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">profile_gate</text><rect x="640" y="120" width="288" height="70" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="144" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">A drafted agent profile</text><text x="654" y="165" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">fields, principles, tools</text><path d="M784,190 L784,226" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="226" width="288" height="70" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="654" y="250" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">check, hold, re-check</text><text x="654" y="271" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">the same screen, plus field rules</text><path d="M784,296 L784,332" fill="none" stroke="#6b7480" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="332" width="288" height="90" rx="8" fill="#2c261d" stroke="#e09f3e" stroke-width="1.5"/><text x="654" y="356" font-size="15" font-weight="600" fill="#e09f3e" text-anchor="start">A person at a terminal</text><text x="654" y="377" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">writes the agent file</text><text x="654" y="396" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">or does not</text><text x="32" y="508" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Nothing here calls a model. They are the guard rails around one.</text><text x="32" y="528" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">Standard-library Python (sqlite3 included), plus the git command for plankit.</text></svg>
