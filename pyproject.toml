[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
version = "0.1.0"
description = "Small, tested tools for running coding agents under plans, review gates and an advisory memory."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harvey Jenkins" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plankit = "agent_workflow.plankit:main"

[tool.setuptools]
packages = ["agent_workflow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
